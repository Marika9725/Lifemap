spring:
  h2:
    console:
      enabled: true
      path: '/h2-console'
  datasource:
    url: 'jdbc:h2:file:./lifemap-db'
    username: 'sa'
    password:
    driver-class-name: 'org.h2.Driver'
  jpa:
    hibernate:
      ddl-auto: update

  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false
  devtools:
    livereload:
      enabled: true

server:
  servlet:
    session:
      timeout: 60m