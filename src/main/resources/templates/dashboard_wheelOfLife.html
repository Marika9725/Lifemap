<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" type="text/css" th:href="@{/css/style_user.css}"/>
        <link rel="stylesheet" type="text/css" th:href="@{/css/style_user_wheelOfLife.css}"/>
        <title>Lifemap App - The Wheel of Life</title>
    </head>
    <body>
        <header th:replace="fragments :: header"></header>

        <div class="container">
            <aside th:replace="fragments :: navigationBar"></aside>
            <main>
                <div class="leftPart">
                    <div class="wheelOfLife">
                        <canvas id="wheelChart" style="width: 100%; height: 100%;"></canvas>
                    </div>

                    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

                    <script th:inline="javascript">
                        const areas = /*[[${areas}]]*/ [];
                    </script>

                    <script src="/js/wheelOfLife.js"></script>
                    <div class="separator"></div>
                </div>
                <div class="rightPart">
                    <h2 th:text="#{html.wheelOfLifePage.header}">Obszary życia</h2>

                    <div class="scrollable-table">
                        <table>
                            <tr th:each="area : ${areas}">
                                <td>
                                    <a href="#" th:text="${area.name}">-</a>
                                </td>
                                <td>
                                    <p th:text="|${area.rate} / 10|"></p>
                                </td>
                                <td>
                                    <div class="button-row">
                                        <form class="btn" method="post" th:action="@{/dashboard/wheelOfLife}">
                                            <input type="number" min="0" max="10" name="lifeAreaRate" th:placeholder="${area.rate}"/>
                                            <input type="hidden" th:name="lifeAreaId" th:value="${area.id}"/>
                                            <button type="submit" name="action" value="patch" th:title="#{html.wheelOfLifePage.changeRating}">✔</button>
                                        </form>
                                        <form class="btn" method="post" th:action="@{/dashboard/wheelOfLife}">
                                            <input type="hidden" name="lifeAreaId" th:value="${area.id}"/>
                                            <button type="submit" name="action" value="delete" class="removeBtn" th:title="#{html.wheelOfLifePage.button.removeArea}">
                                                <img th:src="@{/images/remove.png}" alt="removeArea"/>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>

<!--                    <div class="spacer"></div>-->

                    <div class="addLifeArea">
                        <p>
                            <span class="bold" th:text="#{html.wheelOfLifePage.average}"></span>
                            <span th:text="${average}"></span>
                        </p>

                        <div class="separator-row"></div>

                        <form method="post" th:action="@{/dashboard/wheelOfLife}" th:object="${newLifeArea}">
                            <input type="text" maxLength="20" th:placeholder="#{html.wheelOfLifePage.areaName}" th:field="*{name}"/>
                            <input type="number" min="0" max="10" th:placeholder="#{html.wheelOfLifePage.areaRate}" th:field="*{rate}"/>
                            <button type="submit" th:text="#{html.wheelOfLifePage.button.addArea}">Dodaj obszar</button>
                            <div class="errors" th:if="${#fields.hasAnyErrors()}">
                                <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                                <p class="error" th:if="${#fields.hasErrors('rate')}" th:errors="*{rate}"></p>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
